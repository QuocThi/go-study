[SERVICE]
    Flush        1
    Daemon       off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name        tail
    Path        /var/log/kafka-producer/*.log
    Tag         app.logs
    Parser      json
    DB          /fluent-bit/state/flb_tail.db
    Mem_Buf_Limit 10MB
    Skip_Long_Lines On

[FILTER]
    Name        modify
    Match       app.logs
    Set         source kafka-producer

[OUTPUT]
    Name        kafka
    Match       app.logs
    Brokers     kafka1:9092,kafka2:9092,kafka3:9092
    Topics      logs
    rdkafka.queue.buffering.max.ms 500
    rdkafka.request.required.acks 1
    rdkafka.compression.codec gzip

